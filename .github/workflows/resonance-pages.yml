# Publishes the Résonance industrielle web version (installable, works offline) on GitHub Pages.
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Résonance industrielle · GitHub Pages
on:
  push:
    branches: [master, main]
    paths: ['Resonance-Industrielle/**', '.github/workflows/resonance-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Resonance-Industrielle
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: node --test --test-isolation=none tests/*.test.mjs
      - run: node scripts/site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Resonance-Industrielle/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
