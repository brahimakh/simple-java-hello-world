 .mobile-menu select{margin:0}

 table{display:block;overflow-x:auto}

 Old batches may delay this result.","Suivre la sortie de la presse":"Inspect the press output","Comparer deux ordres":"Compare two orders","Quand marqueur, accumulateur et tisseur sont disponibles, comparez marqueur → accumulateur → tisseur avec accumulateur → marqueur → tisseur. Essayez le seuil 80 à la Fonderie. Le banc permet de comparer sans vider vos files réelles.":"When marker, accumulator and weaver are available, compare marker → accumulator → weaver with accumulator → marker → weaver. Try threshold 80 in the foundry. The bench compares layouts without emptying your real queues.","Préparer une comparaison":"Prepare a comparison","Recevoir un lot sur une autre ligne":"Receive a batch on another line","Créez une ligne en mode réception de branche, puis choisissez-la dans un aiguillage. Un compteur « Branche » supérieur à zéro confirme la première livraison. Les nouveaux modificateurs sont insérés avant l’aiguillage.":"Create a line in branch reception mode, then select it in a router. A “Branch” count above zero confirms the first delivery. New modifiers are inserted before the router.","Préparer une destination":"Prepare a destination","Fermer la boucle entre les usines":"Close the loop between facilities","À 1 000 composants cumulés, construisez dans la Serre. Produisez des catalyseurs et observez leur retour vers la Fonderie dans la vue générale.":"At 1,000 lifetime components, build in the greenhouse. Produce catalysts and watch their return to the foundry in the overview.","Observer les échanges":"Observe transfers","APRÈS LA PUISSANCE, LA MAÎTRISE":"AFTER POWER, MASTERY","Défis d’invention":"Invention challenges","Trois essais facultatifs de 60 secondes actives. Aucun reset, aucune dépense d’inscription. Les machines continuent de produire pour votre partie.":"Three optional trials lasting 60 active seconds. No reset, no entry fee. Machines keep producing for your game.","Gardez les machines, réglages, niveaux et transferts inchangés pendant l’essai. Une modification interrompt la mesure ; la pause suspend le chronomètre. La validation conserve un badge, sans dotation supplémentaire.":"Keep machines, settings, levels and transfers unchanged during the trial. A change interrupts measurement; pausing stops the timer. Success saves a badge, with no extra grant.","Puissance sobre":"Frugal power","Sur 60 s : produire 6 000 composants, récupérer 500 matières et préserver la réserve d’énergie de Fonderie. Pendant cet essai, sa génération est limitée à 8 énergie/s ; vos niveaux sont conservés et reprennent ensuite.":"Over 60 s: produce 6,000 components, recover 500 material and preserve foundry energy stock. During this trial, its generation is limited to 8 energy/s; your levels are retained and resume afterwards.","Deux sorties, une invention":"Two outputs, one invention","Sur 60 s : livrer au moins 5 lots locaux et 5 lots de branche par les aiguillages de Fonderie ; deux presses de Fonderie doivent produire chacune au moins 300 composants.":"Over 60 s: deliver at least 5 local and 5 branch batches through foundry routers; two foundry presses must each produce at least 300 components.","Symbiose industrielle":"Industrial symbiosis","Sur 60 s : produire 10 000 composants et 30 catalyseurs, puis transférer au moins 20 catalyseurs vers la Fonderie.":"Over 60 s: produce 10,000 components and 30 catalysts, and transfer at least 20 catalysts to the foundry.","Composants produits":"Components produced","Matières récupérées":"Material recovered","Générateurs au niveau 0":"Generators at level 0","Énergie préservée":"Energy preserved","Lots locaux":"Local batches","Lots de branche":"Branch batches","Presses ayant produit 300 composants":"Presses producing 300 components","Catalyseurs produits":"Catalysts produced","Catalyseurs transférés":"Catalysts transferred","✓ Défi réussi":"✓ Challenge complete","Temps de l’essai":"Trial time","Arrêter cet essai":"Stop this trial","Réessayer 60 s":"Retry for 60 s","Lancer un essai de 60 s":"Start a 60 s trial","Essais disponibles à 1 000 composants cumulés. Préparez librement vos plans avant.":"Trials unlock at 1,000 lifetime components. You can prepare your layouts beforehand.","Essai interrompu : la configuration a changé. Vous pouvez recommencer.":"Trial interrupted: the layout changed. You can start again.","Défi réussi : votre invention est certifiée.":"Challenge complete: your invention is certified.","Objectifs non atteints sur cette fenêtre. Ajustez votre invention et réessayez.":"Targets not reached in this window. Adjust your invention and try again."};var Lt={stamp:["Delivery marker","Marks a delivery with 1 imprint of its colour (cyan, or amber from 3 M lifetime). A batch receives only one imprint per colour, even after amplification. The accumulator adds imprints in proportion to the material collected. Cycle: 0.1 s."],weave:["Weaver","Consumes batch imprints to multiply quality by (1 + imprints), up to ×8. A batch carrying both colours gains another ×2. Without imprints: ×1. A consumed imprint cannot be reactivated. Cycle: 0.2 s."],router:["Router","Routes each batch to the local continuation or to the first card after the injector of another line in the same facility. Modes: small batches, large batches, alternating, or overflow when the local output is blocked. The batch arrives on the next step, without copying. Cycle: 0.2 s. A missing or full destination stops the batch."],intake:["Injector","Every 0.5 s: takes 6 or 12 material (adjustable) from local stock. Waits if stock or output is unavailable. In the greenhouse, takes residue; in the forge, catalysts. Maximum rate: 24 material/s per injector."],cadence:["Resonator","On each delivery of ≤ 12 material, gains one harmony if the previous delivery was ≤ 2 s ago (4 harmonies at most). Quality × (1 + harmonies ÷ n), where n is this resonator’s rank for this batch: the 1st gives up to ×5, the 2nd ×3, the 3rd ×2.33… A delivery > 12 or a gap > 2 s breaks the sequence. Cycle: 0.1 s."],batch:["Accumulator","Collects material up to the chosen threshold, then delivers exactly that batch. Preserves weighted average quality. At most 1 delivery/s. The press rewards batches of 80 or more."],charge:["Charging chamber","Holds each batch for the chosen duration. Quality × (1 + duration / 2). Uses 0.2 energy × material × duration. Only one batch charges at a time; the cost is reserved at the start."],press:["Press","1 batch/s, up to 160 material. Foundry: material / 10 × quality × large-batch bonus (×8 at 80+) × catalysis (×4 for 1 catalyst) × overheat (×10 for 1 plasma). Cost: 0.5 energy/material. Produces residue. Greenhouse: material / 20 × quality catalysts, cost 0.25 energy/material. Forge: material / 40 × quality plasma, cost 1 energy/material."],recovery:["Reclaimer","On cycle completion: returns 80% of the material to its home stock (material to the foundry, residue to the greenhouse), only once per batch. Cost: 0.05 energy/material. Cycle: 0.2 s."],exchanger:["Exchanger","On Foundry cycle completion: recovers 80% of pressing energy, only once per batch. Cycle: 0.2 s. Charging and reclamation costs are not refunded."],sync:["Synchroniser","On delivery, if local stock holds at least 10 catalysts: uses 1 catalyst and multiplies quality by 3. Otherwise waits. Cycle: 0.5 s. Also works before a catalysed press."],split:["Splitter","Cuts each batch into two halves of equal quality; imprints are shared equally. Two small batches can then feed a resonator. Cycle: 0.2 s."],filter:["Filter","Lets through batches whose quality reaches the chosen threshold. The others go back to the first card after the injector of the same line, on the next step. On the 8th return the batch passes anyway. Cycle: 0.1 s."],mirror:["Mirror","Remembers the original quality of the last batch received. A weaker batch receives that quality, for 0.2 energy per material. A reflection is never reflected: only the original quality is remembered. Memory clears after 3 s without a batch. Cycle: 0.2 s."],furnace:["Furnace","Each batch adds heat equal to its material ÷ 10; the furnace loses 10% of its heat per second (maximum 100). Quality × (1 + heat ÷ 25), up to ×5. Cost: 0.1 energy/material. It rewards high-throughput lines. Cycle: 0.1 s."],compress:["Compressor","Waits for N batches (2, 4 or 8), then delivers a single batch: total material ÷ N, average quality × N × 0.75. Less material, more density: works around the press limit of one batch per second. Cycle: 1 s."],harmonic:["Harmoniser","If a harmoniser on another line of the same facility delivered on this step or the previous one: quality ×3. Otherwise ×1. Lines tuned to the same cadence reinforce each other. Cycle: 0.1 s."],sensor:["Sensor","Lets a batch through only if the chosen stock of the facility reaches the threshold (energy, catalysts, material or plasma). Otherwise it holds it. Protects a resource for the machines that follow. Cycle: 0.1 s."]},Wa={10:"Resonator available · deliveries can resonate.",30:"Delivery marker available · each delivery can leave an imprint.",50:"Accumulator available · batch size becomes a choice.",60:"Router available · lines can cooperate.",80:"Weaver available · process order changes the result.",160:"Charging chamber available · time becomes a raw material.",400:"Recovery available · outputs can feed inputs.",1e3:"Greenhouse, synchroniser and encapsulation available.",3e3:"Splitter available · a large batch can become two small ones.",1e4:"Filter available · weak batches can go round again.",3e4:"Mirror available · a rich batch can inspire another.",1e5:"Furnace and contracts available · throughput becomes heat.",3e5:"Compressor available · densify rather than accumulate.",1e6:"Harmoniser, sensor and masteries available · each family in use can double its effect.",3e6:"Amber imprint available · a two-colour batch doubles weaving.",1e8:"Plasma forge available · a third facility closes the triangle.",1e12:"Refoundation possible · start again stronger, inventions  et rend leurs coûts et matières internes. Les nouveaux cycles démarrent à zéro ; les plans ne sont pas des instantanés de production.":"Restoring replaces the facility’s lines and refunds their costs and internal material. New cycles start from zero; blueprints are not production snapshots.","{0} · {1} lignes":"{0} · {1} lines",Restaurer:"Restore","Supprimer cette configuration":"Delete this configuration","Enregistrez une configuration depuis l’atelier, dès maintenant.":"You can save a configuration from the workshop right now.","PROTOCOLES / AUCUNE RECETTE IMPOSÉE":"PROTOCOLS / NO REQUIRED BUILD","Carnet d’expériences":"Experiment notebook","EXPÉRIENCE {0}":"EXPERIMENT {0}","EXPÉRIENCE {0} · VALIDÉE":"EXPERIMENT {0} · COMPLETED","Dotation : {0} ⬡":"Grant: {0} ⬡",Validée:"Completed",Valider:"Claim","En cours":"In progress","MESURES / SECONDES DE SIMULATION":"MEASUREMENTS / SIMULATED SECONDS","Un laboratoire qui s’explique":"A laboratory you can understand","Moyenne sur {0} s":"Average over {0} s","Plus grand lot produit · pas un débit":"Largest output batch · not a rate","Matières récupérées":"Material recovered","La moyenne glissante inclut les changements de configuration. Un cycle long demande au moins une minute d’observation. Aucune comparaison automatique avec une référence différente.":"The rolling average includes configuration changes. Long cycles need at least one minute of observation. No automatic comparison against a different reference.","Journal de l’installation":"Facility log","Historique du débit par seconde sur les 120 dernières secondes":"Production per second over the last 120 seconds","Échelle auto · pic {0}/s":"Auto scale · peak {0}/s",maintenant:"now","Résonance industrielle · un atelier pour vos idées":"Industrial Resonance · a workshop for your ideas","Déterministe · Réversible · Local":"Deterministic · Reversible · Local","CARNET DE LABORATOIRE":"LABORATORY NOTEBOOK",Fermer:"Close",Nom:"Name","Les noms et plans restent sur cet ordinateur.":"Names and blueprints stay on this computer.",Enregistrer:"Save","Donner un nom à cette invention":"Name this invention","Coût de construction : {0} composants. Tampon : 800 matières. Qualité maximale : ×10⁶.":"Construction cost: {0} components. Buffer: 800 material. Maximum quality: ×10⁶.","Partie sauvegardée sur cet ordinateur.":"Game saved on this computer.","Recommencer une partie ?":"Start a new game?","La partie courante sera remplacée. Exportez-la pour conserver vos inventions.":"The current game will be replaced. Export it to keep your inventions.","Confirmer la nouvelle partie":"Confirm new game","Débit moyen et pic de production":"Average rate and peak production","{0} composants/s":"{0} components/s","sur {0} secondes de simulation.":"over {0} simulated seconds.","Chaque seconde, le moteur mesure la production réelle des presses. La moyenne porte sur les 60 dernières secondes disponibles, y compris les changements de configuration. Les dotations d’expériences et remboursements sont exclus.":"Every second, the engine measures actual press output. The average covers the last 60 available seconds, including configuration changes. Experiment grants and refunds are excluded.","Plus grand cycle : {0} composants. Ce pic ne constitue pas un débit soutenu.":"Largest cycle: {0} components. This peak is not a sustained rate.","Formule de la Fonderie : matières ÷ 10 × qualité × (8 si lot ≥ 80, sinon 1) × (4 si 1 catalyseur consommé, sinon 1). Chaque presse ne traite qu’un lot par seconde.":"Foundry formula: material ÷ 10 × quality × (8 if batch ≥ 80, otherwise 1) × (4 if 1 catalyst is used, otherwise 1). Each press handles at most one batch per second.","Réserve locale :":"Local stock:","/ 10¹².":"/ 10¹².","Extraction de base : 12/s, multipliée par 2 à chaque niveau. Les injecteurs prélèvent 6 ou 12 matières par cycle de 0,5 s, selon leur réglage. Le récupérateur peut restituer 80 % après pressage.":"Base extraction: 12/s, doubled at each level. Injectors take 6 or 12 material per 0.5 s cycle, according to their setting. A reclaimer can return 80% after pressing.","Génération de base : 8/s × 2 par niveau. Chaque presse consomme 0,5 énergie/matière à la Fonderie, 0,25 à la Serre. Les charges et récupérateurs ont leurs coûts propres.":"Base generation: 8/s × 2 per level. Each press uses 0.5 energy/material in the Foundry, 0.25 in the greenhouse. Chargers and reclaimers have their own costs.","Produit par les presses de la Fonderie. Sert de budget commun de construction et d’amélioration. Les déblocages utilisent la production cumulée, jamais le stock restant.":"Produced by Foundry presses. The shared budget for construction and upgrades. Unlocks use lifetime production, never remaining stock.","Chaque pressage de la Fonderie crée 0,5 résidu/matière sous forme de chaleur exploitable. La Serre les reçoit à 20/s maximum.":"Each Foundry press cycle creates 0.5 residue/material as usable heat. The greenhouse receives it at up to 20/s.","La Serre transforme 20 résidus en 1 catalyseur, multiplié par la qualité du lot. Retour vers la Fonderie : 4/s maximum. Une presse de Fonderie peut en consommer 1 pour une sortie ×4.":"The greenhouse turns 20 residue into 1 catalyst, multiplied by batch quality. Return to the Foundry: up to 4/s. A Foundry press can use 1 for ×4 output.","Les retours de cycle sont crédités au pas suivant. Aucun stock ne devient négatif.":"Cycle returns are credited on the next step. Stocks never become negative.","Bienvenue au laboratoire":"Welcome to the laboratory","Votre première ligne fonctionne déjà. Observez les cartes, essayez un module, puis regardez la production changer. Vous n’avez rien à cliquer pour produire.":"Your first line is already running. Inspect the cards, try a module, then watch production change. You do not need to click to produce.","Les cartes s’alimentent de gauche à droite. Leurs flèches ouvrent ou ferment une connexion.":"Cards feed each other from left to right. Their arrows open or clo  & unlocks","Essayer une autre idée":"Try another idea","ÉTAPE {0} / 5":"STEP {0} / 5","Étapes du guide":"Guide steps","Guide terminé":"Guide complete","1. D’où vient la matière ?":"1. Where does material come from?","L’extraction remplit une réserve. L’injecteur y prélève des matières et les livre à la carte suivante. Sélectionnez-le : son panneau explique le débit et le cycle.":"Extraction fills a stock. The injector takes material from it and delivers it to the next card. Select it: its panel explains the rate and cycle.","Examiner l’injecteur":"Inspect the injector","2. Comment gagner des composants ?":"2. How do you earn components?","La presse consomme les lots reçus et de l’énergie, puis produit les composants qui paient vos constructions. Sélectionnez-la pour lire sa règle.":"The press uses delivered batches and energy, then produces the components that pay for construction. Select it to read its rule.","Examiner la presse":"Inspect the press","3. Changer une règle":"3. Change a rule","Ajoutez un module de votre choix dans « Modules disponibles ». Lisez sa règle avant de l’acheter. Le premier se débloque à 10 composants produits ; dépenser votre budget ne retire aucun déblocage.":"Add a module of your choice from “Available modules”. Read its rule before buying it. The first unlocks at 10 produced components; spending your budget never removes an unlock.","Voir les modules":"See modules","4. Vérifier l’effet de votre idée":"4. Check your idea’s effect","Ouvrez le débit moyen et laissez votre nouveau module traiter un lot. Observez plusieurs cycles : un gros pic ne garantit pas un meilleur débit. Vous pouvez réorganiser ou démonter sans pénalité.":"Open the average rate and let your new module process a batch. Watch several cycles: a big peak does not guarantee a better rate. You can rearrange or dismantle without a penalty.","Comprendre le débit":"Understand the rate","Le guide attend que votre module ait traité un lot.":"The guide is waiting for your module
